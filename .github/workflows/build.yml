name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "${HOME}/go/bin" >> $GITHUB_PATH

      - name: Compute Version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Fetch DM plugin
        shell: pwsh
        run: ./scripts/fetch-dm.ps1

      - name: Build frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..

      - name: Build dmfindpic sidecar (386)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "386"
          go build -o build/bin/dmfindpic.exe ./cmd/dmfindpic

      - name: Build (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/bin/dm | Out-Null
          Copy-Item -Force third_party/dm/* build/bin/dm/
          wails build -platform windows/amd64 -clean -ldflags "-X main.AppVersion=${{ steps.ver.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "wails build failed with exit code $LASTEXITCODE" }
          Copy-Item -Force "build/bin/tlbb-game-screen-monitor.exe" "build/bin/游戏掉线监控-windows-amd64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/bin/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/**/游戏掉线监控-windows-amd64.exe
            dist/**/dmfindpic.exe
            dist/**/dm/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
