name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "${HOME}/go/bin" >> $GITHUB_PATH

      - name: Compute Version
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore cached OpenCV install
        uses: actions/cache/restore@v4
        id: cache-opencv-install
        with:
          path: opencv/build/install
          key: opencv-install-mingw-4110-slim-v2
          restore-keys: |
            opencv-install-mingw-4110-slim-

      - name: Restore cached OpenCV source
        uses: actions/cache/restore@v4
        id: cache-opencv-source
        with:
          path: opencv/opencv-4.11.0
          key: opencv-source-4110-slim-v2
          restore-keys: |
            opencv-source-4110-slim-

      - name: OpenCV cache status
        shell: pwsh
        run: |
          Write-Host "install cache hit: ${{ steps.cache-opencv-install.outputs.cache-hit }}"
          Write-Host "source cache hit:  ${{ steps.cache-opencv-source.outputs.cache-hit }}"

      - name: Install OpenCV
        shell: pwsh
        run: ./scripts/setup-opencv.ps1

      - name: Save cached OpenCV install
        if: steps.cache-opencv-install.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: opencv/build/install
          key: opencv-install-mingw-4110-slim-v2

      - name: Save cached OpenCV source
        if: steps.cache-opencv-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: opencv/opencv-4.11.0
          key: opencv-source-4110-slim-v2

      - name: Build (Windows)
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -clean -tags customenv -ldflags "-X main.AppVersion=${{ steps.ver.outputs.version }}"
          Copy-Item -Force "build/bin/tlbb-game-screen-monitor.exe" "build/bin/游戏掉线监控-windows-amd64.exe"
          ./scripts/copy-runtime-dlls.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/bin/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/**/游戏掉线监控-windows-amd64.exe
            dist/**/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
